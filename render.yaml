services:
  - type: web
    name: orca-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: .
      - key: DEMO_MODE
        value: "false"
